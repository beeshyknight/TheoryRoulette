<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Theory Roulette r1 Simulator</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#111827;color:#eee;font-family:Arial,sans-serif;padding:24px}.wrap{display:grid;grid-template-columns:auto 260px;gap:30px;align-items:center}.r1{width:318px;height:530px;border-radius:42px;background:#f1f1ed;border:2px solid #d4d4cf;box-shadow:0 25px 70px #0008;position:relative;padding-top:55px}.screen{width:240px;height:282px;margin:auto;background:#000;border:7px solid #1b1b1b;border-radius:7px;overflow:hidden}.screen iframe{display:block;width:240px;height:282px;border:0}.wheel{position:absolute;right:-5px;top:368px;width:27px;height:95px;border-radius:13px;background:linear-gradient(90deg,#c9c9c4,#f8f8f2,#bbb);border:1px solid #aaa}.side-button{position:absolute;left:-7px;top:350px;width:9px;height:58px;border-radius:5px;background:#deded8;border:1px solid #aaa}.panel{background:#0f172a;border:1px solid #334155;border-radius:16px;padding:18px}.panel h1{font-size:20px;margin:0 0 6px;color:#facc15}.panel p{font-size:13px;line-height:1.4;color:#cbd5e1}.buttons{display:grid;gap:8px}.buttons button{min-height:42px;border:1px solid #475569;border-radius:8px;background:#1e293b;color:#fff;font-weight:800;cursor:pointer}.buttons .side{background:#854d0e;border-color:#ca8a04}.buttons .long{background:#4c1d95;border-color:#7c3aed}.buttons .shake{background:#065f46;border-color:#10b981}@media(max-width:720px){.wrap{grid-template-columns:1fr}.panel{width:318px}}</style></head>
<body><div class="wrap"><div class="r1"><div class="screen"><iframe id="game" src="./index.html" title="Theory Roulette r1"></iframe></div><div class="wheel"></div><div class="side-button"></div></div><aside class="panel"><h1>Theory Roulette r1</h1><p>Simulator fires the same browser events used by the R1 Creation.</p><div class="buttons"><button onclick="fire('scrollUp')">▲ WHEEL UP</button><button onclick="fire('scrollDown')">▼ WHEEL DOWN</button><button class="side" onclick="fire('sideClick')">SIDE CLICK</button><button class="long" onclick="fire('longPressStart')">LONG PRESS</button><button class="shake" onclick="fire('shakeTheoryRoulette')">SHAKE</button></div></aside></div><script>function fire(type){const frame=document.getElementById('game');frame.contentWindow.dispatchEvent(new CustomEvent(type));frame.focus();}</script></body></html>
