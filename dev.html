<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Theory Roulette R1 simulator</title><style>body{margin:0;background:#111;color:#fff;font-family:Arial;display:grid;place-items:center;min-height:100vh}.wrap{text-align:center}.device{width:240px;height:282px;border:12px solid #222;border-radius:28px;overflow:hidden;box-shadow:0 20px 60px #000}.device iframe{width:240px;height:282px;border:0}.controls{margin-top:16px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}button{padding:8px 12px}</style></head><body><div class="wrap"><div class="device"><iframe id="r1" src="./index.html"></iframe></div><div class="controls"><button onclick="fire('scrollUp')">◀ wheel</button><button onclick="fire('sideClick')">button</button><button onclick="fire('scrollDown')">wheel ▶</button><button onclick="shake()">shake</button></div></div><script>function fire(n){document.getElementById('r1').contentWindow.dispatchEvent(new Event(n))}function shake(){document.getElementById('r1').contentWindow.dispatchEvent(new Event('shakeTheoryRoulette'))}</script></body></html>
